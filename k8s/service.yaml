apiVersion: v1
kind: Service
metadata:
  name: product-similarity
  labels:
    app: product-similarity
spec:
  # NodePort exposes the service on the minikube node so we can reach it locally
  # at a STABLE, documented port (30080) rather than a random one.
  type: NodePort
  selector:
    app: product-similarity
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
      protocol: TCP
