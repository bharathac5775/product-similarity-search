<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fashion Finder{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">
      <span class="brand-mark">FF</span>
      <span class="brand-name">Fashion&nbsp;Finder</span>
    </a>
    <form class="search" action="/" method="get" role="search">
      <input type="text" name="q" value="{{ q|default('', true) }}"
             placeholder="Search for products, brands and more"
             aria-label="Search products" autocomplete="off">
      <button type="submit" aria-label="Search">Search</button>
    </form>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>Fashion Finder — similar-product discovery powered by a content-based similarity engine.</p>
  </footer>
</body>
</html>
